<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a lesson</title>
</head>
<body>

<h1>Book a lesson</h1>

<h2>
    <span th:text="${teacher.firstName}">Teacher First</span>
    <span th:text="${teacher.lastName}">Teacher Last</span>
</h2>

<form th:action="@{|/teachers/${teacher.id}/booking|}"
      th:object="${bookingForm}"
      method="post">

    <div>
        <label>Your first name:</label>
        <input th:field="*{studentFirstName}" type="text" />
        <div th:if="${#fields.hasErrors('studentFirstName')}"
             th:errors="*{studentFirstName}"
             style="color:red"></div>
    </div>

    <div>
        <label>Your last name:</label>
        <input th:field="*{studentLastName}" type="text" />
        <div th:if="${#fields.hasErrors('studentLastName')}"
             th:errors="*{studentLastName}"
             style="color:red"></div>
    </div>

    <div>
        <label>Your username:</label>
        <input th:field="*{studentUsername}" type="text" placeholder="e.g. anna123" />
        <div th:if="${#fields.hasErrors('studentUsername')}"
             th:errors="*{studentUsername}"
             style="color:red"></div>
    </div>

    <div>
        <label>Your email:</label>
        <input th:field="*{studentEmail}" type="email" />
        <div th:if="${#fields.hasErrors('studentEmail')}"
             th:errors="*{studentEmail}"
             style="color:red"></div>
    </div>

    <div>
        <label>Your phone:</label>
        <input th:field="*{studentPhone}" type="text" placeholder="+48123456789" />
        <div th:if="${#fields.hasErrors('studentPhone')}"
             th:errors="*{studentPhone}"
             style="color:red"></div>
    </div>

    <div>
        <label>Preferred date:</label>
        <input th:field="*{lessonDate}" type="date" />
        <div th:if="${#fields.hasErrors('lessonDate')}"
             th:errors="*{lessonDate}"
             style="color:red"></div>
    </div>

    <div>
        <label>Preferred time:</label>
        <input th:field="*{lessonTime}" type="time" />
        <div th:if="${#fields.hasErrors('lessonTime')}"
             th:errors="*{lessonTime}"
             style="color:red"></div>
    </div>

    <div>
        <label>Note (optional):</label><br>
        <textarea th:field="*{note}" rows="5" cols="40"></textarea>
        <div th:if="${#fields.hasErrors('note')}"
             th:errors="*{note}"
             style="color:red"></div>
    </div>

    <button type="submit">Send booking request</button>
</form>

<p>
    <a th:href="@{'/teachers/' + ${teacher.id}}">← Back to teacher profile</a>
</p>

</body>
</html>
