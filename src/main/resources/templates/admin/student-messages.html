<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student messages</title>
</head>
<body>

<h1>Messages from student</h1>

<h2>
  <span th:text="${student.firstName}">First</span>
  <span th:text="${student.lastName}">Last</span>
</h2>

<p>
  <a href="/admin/students">← Back to students</a>
</p>

<table border="1" cellspacing="0" cellpadding="4">
  <thead>
  <tr>
    <th>Teacher</th>
    <th>Message</th>
    <th>Sent at</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="m : ${messages}">
    <td>
      <span th:text="${m.teacher.firstName}">Teacher</span>
      <span th:text="${m.teacher.lastName}">Teacher</span>
    </td>
    <td th:text="${m.content}">Message text</td>
    <td th:text="${m.createdAt}">2026-01-14T20:00</td>
  </tr>
  </tbody>
</table>

</body>
</html>
