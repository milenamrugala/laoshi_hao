<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin – Messages for Teacher</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-messages-scope">

<div class="site-wrapper admin-messages-scope">
  <div th:replace="fragments/admin-header :: adminHeader"></div>

  <main class="site-main">
    <div class="dashboard-wrap">

      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Messages for teacher</h1>
          <p class="dashboard-subtitle">
            <strong th:text="${teacher.firstName} + ' ' + ${teacher.lastName}">Teacher Name</strong>
          </p>
        </div>

        <div class="dashboard-actions">
          <a class="btn btn-messages" th:href="@{/admin/teachers}">Back to teachers</a>
          <a class="btn btn-bookings" th:href="@{/admin/messages}">All messages</a>
        </div>
      </div>

      <div class="section-grid">
        <div class="kawaii-card">
          <h2>Messages</h2>

          <div class="table-wrap">
            <table class="kawaii-table">
              <thead>
              <tr>
                <th>Sent at</th>
                <th>Student name</th>
                <th>Student username</th>
                <th>Student email</th>
                <th>Student phone</th>
                <th>Message</th>
                <th>Actions</th>
              </tr>
              </thead>

              <tbody>
              <tr th:each="msg : ${messages}">
                <td th:text="${msg.createdAt}">2026-01-14T20:00</td>

                <td>
                  <span th:text="${msg.studentFirstName}">Student first</span>
                  <span th:text="${msg.studentLastName}">Student last</span>
                </td>

                <td th:text="${msg.studentUsername}">student.username</td>
                <td th:text="${msg.studentEmail}">student@example.com</td>
                <td th:text="${msg.studentPhone}">+48123456789</td>

                <td class="message-cell" th:text="${msg.content}">Message body</td>

                <td>
                  <div class="row-actions">
                    <form th:action="@{'/admin/messages/' + ${msg.id} + '/delete'}"
                          method="post">
                      <input type="hidden" name="teacherId" th:value="${teacher.id}"/>
                      <button class="btn btn-danger small-btn" type="submit"
                              onclick="return confirm('Are you sure you want to delete this message?');">
                        Delete
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
              </tbody>

            </table>
          </div>

        </div>
      </div>

    </div>
  </main>

  <div th:replace="fragments/admin-footer :: adminFooter"></div>
</div>

</body>
</html>
