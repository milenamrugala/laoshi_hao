<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Messages for Teacher</title>
</head>
<body>

<h1>Messages for teacher</h1>

<h2>
  <span th:text="${teacher.firstName}">First name</span>
  <span th:text="${teacher.lastName}">Last name</span>
</h2>

<p>
  <a href="/admin/teachers">← Back to admin teachers list</a> |
  <a href="/admin/messages">All messages →</a>
</p>

<table border="1" cellspacing="0" cellpadding="4">
  <thead>
  <tr>
    <th>Sent at</th>
    <th>Student name</th>
    <th>Student username</th>
    <th>Student email</th>
    <th>Student phone</th>
    <th>Message</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="msg : ${messages}">
    <td th:text="${msg.createdAt}">2026-01-14T20:00</td>
    <td>
      <span th:text="${msg.studentFirstName}">Student first name</span>
      <span th:text="${msg.studentLastName}">Student last name</span>
    </td>
    <td th:text="${msg.studentUsername}">student.username</td>
    <td th:text="${msg.studentEmail}">student@example.com</td>
    <td th:text="${msg.studentPhone}">+48123456789</td>
    <td th:text="${msg.content}">Message body</td>
    <td>
      <form th:action="@{'/admin/messages/' + ${msg.id} + '/delete'}"
            method="post"
            style="display:inline;">
        <input type="hidden" name="teacherId" th:value="${teacher.id}"/>
        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this message?');"
                style="background:#e0e0e0;border:1px solid #999;padding:4px 8px;cursor:pointer;">
          Delete
        </button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
