<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin – Students</title>
</head>
<body>

<h1>Students</h1>

<p>
  <a href="/admin/teachers">← Back to teachers</a> |
  <a href="/admin/messages">Messages</a> |
  <a href="/admin/bookings">Bookings</a>
</p>

<table border="1" cellspacing="0" cellpadding="4">
  <thead>
  <tr>
    <th>ID</th>
    <th>Username</th>
    <th>Email</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Created At</th>
    <th>Actions</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="s : ${students}">
    <td th:text="${s.id}">1</td>
    <td th:text="${s.username}">username</td>
    <td th:text="${s.email}">email</td>
    <td>
      <span th:text="${s.firstName}">First</span>
      <span th:text="${s.lastName}">Last</span>
    </td>
    <td th:text="${s.phone}">+123456789</td>
    <td th:text="${s.createdAt}">2026-01-14T20:00</td>

    <td>
      <!-- EDIT -->
      <form th:action="@{'/admin/students/' + ${s.id} + '/edit'}"
            method="get"
            style="display:inline;">
        <button type="submit"
                style="background:#e0e0e0;border:1px solid #999;padding:4px 8px;cursor:pointer;">
          Edit
        </button>
      </form>

      <!-- DELETE -->
      <form th:action="@{'/admin/students/' + ${s.id} + '/delete'}"
            method="post"
            style="display:inline;">
        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this student?');"
                style="background:#e0e0e0;border:1px solid #999;padding:4px 8px;cursor:pointer;margin-left:5px;">
          Delete
        </button>
      </form>

      <!-- MESSAGES -->
      <a th:href="@{'/admin/students/' + ${s.id} + '/messages'}"
         style="margin-left:8px;">
        Messages
      </a>

      <!-- BOOKINGS -->
      <a th:href="@{'/admin/students/' + ${s.id} + '/bookings'}"
         style="margin-left:8px;">
        Bookings
      </a>
    </td>
  </tr>
  </tbody>

</table>

</body>
</html>
