<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin – Students</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="site-wrapper">
  <div th:replace="fragments/admin-header :: adminHeader"></div>

  <main class="site-main">
    <div class="dashboard-wrap">

      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Admin – Students</h1>
          <p class="dashboard-subtitle">Manage students, their messages and bookings</p>
        </div>

        <div class="dashboard-actions">
          <a class="btn btn-ghost" th:href="@{/admin/teachers}">Teachers</a>
          <a class="btn btn-messages" th:href="@{/admin/messages}">All messages</a>
          <a class="btn btn-bookings" th:href="@{/admin/bookings}">All bookings</a>
        </div>
      </div>

      <div class="section-grid">
        <div class="kawaii-card">
          <h2>Students</h2>

          <div class="table-wrap table-scroll">
            <table class="kawaii-table students-table">
              <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Created at</th>
                <th>Actions</th>
              </tr>
              </thead>

              <tbody>
              <tr th:each="s : ${students}">
                <td th:text="${s.id}">1</td>
                <td th:text="${s.username}">username</td>
                <td th:text="${s.email}">email</td>
                <td>
                  <span th:text="${s.firstName}">First</span>
                  <span th:text="${s.lastName}">Last</span>
                </td>
                <td th:text="${s.phone}">+123456789</td>
                <td th:text="${s.createdAt}">2026-01-14T20:00</td>

                <td>
                  <div class="row-actions">
                    <!-- EDIT -->
                    <form th:action="@{'/admin/students/' + ${s.id} + '/edit'}"
                          method="get">
                      <button class="btn small-btn" type="submit">Edit</button>
                    </form>

                    <!-- DELETE -->
                    <form th:action="@{'/admin/students/' + ${s.id} + '/delete'}"
                          method="post">
                      <button class="btn btn-danger small-btn" type="submit"
                              onclick="return confirm('Are you sure you want to delete this student?');">
                        Delete
                      </button>
                    </form>

                    <!-- MESSAGES -->
                    <a class="btn btn-messages small-btn"
                       th:href="@{'/admin/students/' + ${s.id} + '/messages'}">
                      Messages
                    </a>

                    <!-- BOOKINGS -->
                    <a class="btn btn-bookings small-btn"
                       th:href="@{'/admin/students/' + ${s.id} + '/bookings'}">
                      Bookings
                    </a>
                  </div>
                </td>
              </tr>
              </tbody>

            </table>
          </div>

        </div>
      </div>

    </div>
  </main>

  <div th:replace="fragments/admin-footer :: adminFooter"></div>
</div>

</body>
</html>
