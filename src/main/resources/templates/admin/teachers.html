<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin – Teachers</title>
</head>
<body>

<h1>Admin – Teachers</h1>

<p>
  <a href="/admin/messages">All messages →</a> |
  <a href="/admin/bookings">All bookings →</a>
</p>

<table border="1" cellspacing="0" cellpadding="4">
  <thead>
  <tr>
    <th>Id</th>
    <th>First name</th>
    <th>Last name</th>
    <th>Language taught</th>
    <th>City</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Nationality</th>
    <th>Native language</th>
    <th>Capacity</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>

  <tr th:each="teacher : ${teachers}">
    <td th:text="${teacher.id}">Id</td>
    <td th:text="${teacher.firstName}">First name</td>
    <td th:text="${teacher.lastName}">Last name</td>
    <td th:text="${teacher.language}">Language</td>
    <td th:text="${teacher.city}">City</td>
    <td th:text="${teacher.phone}">Phone</td>
    <td th:text="${teacher.email}">Email</td>
    <td th:text="${teacher.nationality}">Nationality</td>
    <td th:text="${teacher.nativeLanguage}">Native language</td>
    <td th:text="${teacher.capacity}">10</td>
    <td>

      <!-- EDIT BUTTON -->
      <form th:action="@{'/admin/teachers/' + ${teacher.id} + '/edit'}"
            method="get"
            style="display:inline;">
        <button type="submit"
                style="background:#e0e0e0;border:1px solid #999;padding:4px 8px;cursor:pointer;">
          Edit
        </button>
      </form>

      <!-- DELETE BUTTON -->
      <form th:action="@{'/admin/teachers/' + ${teacher.id} + '/delete'}"
            method="post"
            style="display:inline;">
        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this teacher?');"
                style="background:#e0e0e0;border:1px solid #999;padding:4px 8px;cursor:pointer;margin-left:5px;">
          Delete
        </button>
      </form>

      <!-- MESSAGES LINK -->
      <a th:href="@{'/admin/teachers/' + ${teacher.id} + '/messages'}"
         style="margin-left: 8px;">
        Messages
      </a>

      <!-- BOOKINGS LINK -->
      <a th:href="@{'/admin/teachers/' + ${teacher.id} + '/bookings'}"
         style="margin-left: 8px;">
        Bookings
      </a>

    </td>
  </tr>
  </tbody>
</table>
