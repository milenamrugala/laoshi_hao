<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin – Edit Student</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="site-wrapper">
  <div th:replace="fragments/admin-header :: adminHeader"></div>

  <main class="site-main">
    <div class="dashboard-wrap">

      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Edit Student</h1>
          <p class="dashboard-subtitle">Update student details</p>
        </div>

        <div class="dashboard-actions">
          <a class="btn btn-ghost" th:href="@{/admin/students}">Back to students</a>
        </div>
      </div>

      <div class="section-grid">
        <div class="kawaii-card">
          <h2>Student form</h2>

          <form class="kawaii-form"
                th:action="@{|/admin/students/${studentId}/edit|}"
                th:object="${studentForm}"
                method="post">

            <div class="form-grid">
              <div class="field">
                <label>Username</label>
                <input th:field="*{username}" type="text"/>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
              </div>

              <div class="field">
                <label>Email</label>
                <input th:field="*{email}" type="email"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>

              <div class="field">
                <label>First name</label>
                <input th:field="*{firstName}" type="text"/>
                <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
              </div>

              <div class="field">
                <label>Last name</label>
                <input th:field="*{lastName}" type="text"/>
                <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
              </div>

              <div class="field">
                <label>Phone</label>
                <input th:field="*{phone}" type="text"/>
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
              </div>
            </div>

            <div class="form-actions">
              <button class="btn btn-primary" type="submit">Save changes</button>
              <a class="btn btn-ghost" th:href="@{/admin/students}">Cancel</a>
            </div>

          </form>

        </div>
      </div>

    </div>
  </main>

  <div th:replace="fragments/admin-footer :: adminFooter"></div>
</div>

</body>
</html>
