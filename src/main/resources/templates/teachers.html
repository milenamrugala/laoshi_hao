<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Teachers – Laoshi Hao</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="site-wrapper">

  <!-- HEADER -->
  <div th:replace="fragments/header :: header"></div>

  <!-- MAIN -->
  <main class="site-main teachers-page">

    <div class="teachers-layout">

      <!-- LEFT CARD (SIDEBAR) -->
      <aside class="teachers-panel">
        <h1 class="teachers-title">Find teacher</h1>
        <p class="teachers-subtitle">Find by language, city or nationality</p>

        <form th:action="@{/teachers}" method="get" class="teachers-search">

          <label for="q" class="teachers-label">Search</label>
          <input id="q"
                 name="q"
                 type="text"
                 th:value="${q}"
                 class="teachers-input"
                 placeholder="e.g. English / Warsaw / Polish">

          <label for="maxPrice" class="teachers-label">Max price (PLN / hour)</label>
          <input id="maxPrice"
                 name="maxPrice"
                 type="number"
                 step="0.01"
                 min="0"
                 th:value="${maxPrice}"
                 class="teachers-input"
                 placeholder="e.g. 120">

          <button type="submit" class="teachers-btn">Search</button>

          <a th:if="${(q != null and !#strings.isEmpty(q)) or (maxPrice != null and !#strings.isEmpty(maxPrice))}"
             th:href="@{/teachers}"
             class="teachers-clear">
            Clear
          </a>
        </form>
      </aside>

      <!-- RIGHT CARD (RESULTS) -->
      <section class="teachers-main">
        <div class="teachers-main-card">

          <div class="teachers-results-head">
            <div class="teachers-results-title">
              <span th:if="${(q == null or #strings.isEmpty(q)) and (maxPrice == null or #strings.isEmpty(maxPrice))}">
                All teachers
              </span>

              <span th:if="${!((q == null or #strings.isEmpty(q)) and (maxPrice == null or #strings.isEmpty(maxPrice)))}">
                Results
              </span>
            </div>

            <div class="teachers-results-count"
                 th:text="${teachers != null ? #lists.size(teachers) : 0} + ' teachers'">
              0 teachers
            </div>
          </div>

          <div class="teachers-empty" th:if="${teachers == null or #lists.isEmpty(teachers)}">
            No teachers found. Try a different search.
          </div>

          <ul class="teacher-list" th:if="${teachers != null and !#lists.isEmpty(teachers)}">
            <li class="teacher-card" th:each="teacher : ${teachers}">

              <!-- LINK: PHOTO + NAME (tylko to jest klikalne) -->
              <a th:href="@{'/teachers/' + ${teacher.id}}" class="teacher-link">

                <div class="teacher-photo-wrapper">
                  <img th:if="${teacher.photoFilename != null}"
                       th:src="@{'/teacher-photos/' + ${teacher.photoFilename}}"
                       th:alt="'Photo of ' + ${teacher.firstName} + ' ' + ${teacher.lastName}">
                  <span th:if="${teacher.photoFilename == null}">No photo</span>
                </div>

                <div class="teacher-name"
                     th:text="${teacher.firstName + ' ' + teacher.lastName}">
                  Teacher Name
                </div>

              </a>

              <!-- PRICE (pod imieniem, poza linkiem) -->
              <div class="teacher-price"
                   th:if="${teacher.pricePerHour != null}"
                   th:text="${teacher.pricePerHour} + ' PLN / hour'">
                80 PLN / hour
              </div>

              <!-- META (pod ceną, poza linkiem) -->
              <div class="teacher-meta">
                <span th:text="${teacher.language}">Language</span>
                <span class="dot">•</span>
                <span th:text="${teacher.city}">City</span>

                <span th:if="${teacher.nationality != null and !#strings.isEmpty(teacher.nationality)}">
                  <span class="dot">•</span>
                  <span th:text="${teacher.nationality}">Nationality</span>
                </span>
              </div>

            </li>
          </ul>

        </div>
      </section>

    </div>

  </main>

  <!-- FOOTER -->
  <div th:replace="fragments/footer :: footer"></div>

</div>

<!-- SAKURA LAYER -->
<div class="sakura-container"></div>

<script>
  function createSakura() {
    const sakura = document.createElement("div");
    sakura.classList.add("sakura");
    sakura.textContent = "🌸";
    sakura.style.left = Math.random() * 100 + "vw";
    sakura.style.animationDuration = (4 + Math.random() * 6) + "s";
    sakura.style.opacity = Math.random();
    document.querySelector(".sakura-container").appendChild(sakura);
    setTimeout(() => sakura.remove(), 10000);
  }
  setInterval(createSakura, 800);
</script>

</body>
</html>
