<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Laoshi Hao: Register Teacher</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="site-wrapper">
  <div th:replace="fragments/header :: header"></div>

  <main class="site-main">
    <div class="page-wrapper">
      <div class="form-card">

        <h1>Teacher registration</h1>
        <p class="subtitle">Create your teacher profile</p>

        <form th:action="@{/register/teacher}"
              th:object="${teacherForm}"
              method="post"
              class="form-center">

          <div class="form-field">
            <label for="firstName">First name</label>
            <input id="firstName" th:field="*{firstName}" type="text" placeholder="e.g. Monika">
            <div class="form-error"
                 th:if="${#fields.hasErrors('firstName')}"
                 th:errors="*{firstName}"></div>
          </div>

          <div class="form-field">
            <label for="lastName">Last name</label>
            <input id="lastName" th:field="*{lastName}" type="text" placeholder="e.g. Mrugała">
            <div class="form-error"
                 th:if="${#fields.hasErrors('lastName')}"
                 th:errors="*{lastName}"></div>
          </div>

          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" th:field="*{username}" type="text" placeholder="e.g. monika.mrugala">
            <div class="form-error"
                 th:if="${#fields.hasErrors('username')}"
                 th:errors="*{username}"></div>
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" th:field="*{email}" type="email" placeholder="e.g. monika.mrugala@test.com">
            <div class="form-error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
          </div>

          <div class="form-field">
            <label for="phone">Phone</label>
            <input id="phone" th:field="*{phone}" type="text" placeholder="e.g. +48123456789">
            <div class="form-error"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}"></div>
          </div>

          <!-- ✅ DROPDOWN: Language you teach -->
          <div class="form-field">
            <label for="language">Language you teach</label>
            <select id="language" th:field="*{language}">
              <option value="">-- select language --</option>
              <option th:each="lang : ${languages}"
                      th:value="${lang}"
                      th:text="${lang}"></option>
            </select>
            <div class="form-error"
                 th:if="${#fields.hasErrors('language')}"
                 th:errors="*{language}"></div>
          </div>

          <!-- ✅ CITY: choose one (I used SELECT - safest) -->
          <div class="form-field">
            <label for="city">City</label>
            <select id="city" th:field="*{city}">
              <option value="">-- select city --</option>
              <option th:each="c : ${cities}"
                      th:value="${c}"
                      th:text="${c}"></option>
            </select>
            <div class="form-error"
                 th:if="${#fields.hasErrors('city')}"
                 th:errors="*{city}"></div>
          </div>

          <!-- ✅ DROPDOWN: Native language -->
          <div class="form-field">
            <label for="nativeLanguage">Native language</label>
            <select id="nativeLanguage" th:field="*{nativeLanguage}">
              <option value="">-- select native language --</option>
              <option th:each="lang : ${languages}"
                      th:value="${lang}"
                      th:text="${lang}"></option>
            </select>
            <div class="form-error"
                 th:if="${#fields.hasErrors('nativeLanguage')}"
                 th:errors="*{nativeLanguage}"></div>
          </div>

          <!-- ✅ DROPDOWN: Nationality -->
          <div class="form-field">
            <label for="nationality">Nationality</label>
            <select id="nationality" th:field="*{nationality}">
              <option value="">-- select nationality --</option>
              <option th:each="nat : ${nationalities}"
                      th:value="${nat}"
                      th:text="${nat}"></option>
            </select>
            <div class="form-error"
                 th:if="${#fields.hasErrors('nationality')}"
                 th:errors="*{nationality}"></div>
          </div>

          <div class="form-field">
            <label for="capacity">Capacity (max active bookings)</label>
            <input id="capacity" th:field="*{capacity}" type="number" min="1" max="1000">
            <div class="form-error"
                 th:if="${#fields.hasErrors('capacity')}"
                 th:errors="*{capacity}"></div>
          </div>

          <div class="form-field">
            <label for="pricePerHour">Price per lesson (PLN / hour)</label>
            <input id="pricePerHour" th:field="*{pricePerHour}"
                   type="number" step="0.01" min="0"
                   placeholder="e.g. 80.00">
            <div class="form-error"
                 th:if="${#fields.hasErrors('pricePerHour')}"
                 th:errors="*{pricePerHour}"></div>
          </div>

          <div class="form-actions">
            <button type="submit">Create teacher account</button>
          </div>

          <div class="form-links">
            <a href="/">← Back to home</a>
          </div>

        </form>

      </div>
    </div>
  </main>

  <div th:replace="fragments/footer :: footer"></div>
</div>

<div class="sakura-container"></div>

<script>
  function createSakura() {
    const sakura = document.createElement("div");
    sakura.classList.add("sakura");
    sakura.textContent = "🌸";
    sakura.style.left = Math.random() * 100 + "vw";
    sakura.style.animationDuration = (4 + Math.random() * 6) + "s";
    sakura.style.opacity = Math.random();
    document.querySelector(".sakura-container").appendChild(sakura);
    setTimeout(() => sakura.remove(), 10000);
  }
  setInterval(createSakura, 800);
</script>

</body>
</html>
